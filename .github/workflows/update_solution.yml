name: update_solution
on:
  schedule:
    # Each day 13:00 CET / 14:00 CEST. Scheduled runs can be delayed by hours,
    # but 'solution.json' holds solutions for several days in advance and the
    # script is idempotent, so neither delays nor repeated runs are a problem.
    - cron: '0 12 * * *'
  workflow_dispatch:
concurrency:
  group: update-solution
jobs:
  update-solution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node update_solution.js
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - run: |
          git add .
          if git diff --cached --quiet; then
            echo "Nothing to update"
          else
            git commit -m 'Update solution'
            git push
          fi
